<!DOCTYPE html>
<html lang="{{ site.lang | default: 'id' }}">
{% include head.html %}
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
  {% include analytics-noscript.html %}
  <a class="skip" href="#konten">Lewati ke konten</a>
  {% include header.html %}

  <main id="konten">
    {{ content }}
  </main>

  {% include footer.html %}

  <script>
    (function () {
      var year = document.getElementById('year');
      if (year) { year.textContent = new Date().getFullYear(); }

      var toggle = document.getElementById('navToggle');
      var links = document.getElementById('navLinks');
      if (toggle && links) {
        toggle.addEventListener('click', function () {
          var open = links.classList.toggle('open');
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
      }

      // Hero carousel: crossfade, plus dot buttons. Without JS only the first
      // slide is visible and the dots stay hidden, so the hero still reads fine.
      var carousel = document.querySelector('[data-hero-carousel]');
      var slides = carousel ? carousel.querySelectorAll('.hero__slide') : [];
      var dots = document.querySelector('[data-hero-dots]');
      var backdrop = document.querySelector('[data-hero-backdrop]');
      if (slides.length > 1) {
        var current = 0;
        var timer = null;
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
        var buttons = [];

        // Mirror the active photo into the blurred backdrop. The image is
        // already in the cache, so this costs no extra request.
        function paintBackdrop() {
          if (!backdrop) { return; }
          var img = slides[current] ? slides[current].querySelector('img') : null;
          if (!img) { return; }
          var src = img.currentSrc || img.src;
          if (src) { backdrop.style.backgroundImage = 'url("' + src + '")'; }
        }

        function paintDots() {
          buttons.forEach(function (button, index) {
            button.setAttribute('aria-current', index === current ? 'true' : 'false');
          });
        }

        function materialize(index) {
          var slide = slides[index];
          if (!slide || slide.querySelector('picture')) { return; }
          var template = slide.querySelector('template');
          if (template) {
            slide.appendChild(template.content.cloneNode(true));
            slide.removeChild(template);
          }
        }

        function show(next) {
          next = (next + slides.length) % slides.length;
          if (next === current) { return; }
          materialize(next);

          var swap = function () {
            slides[current].classList.remove('is-active');
            slides[current].setAttribute('aria-hidden', 'true');
            current = next;
            slides[current].classList.add('is-active');
            slides[current].removeAttribute('aria-hidden');
            paintDots();
            paintBackdrop();
          };

          // Never crossfade to an image that has not decoded yet: the band would
          // flash empty. Swap immediately if it is ready, otherwise wait.
          var img = slides[next].querySelector('img');
          if (!img || img.complete) { swap(); return; }

          var done = function () {
            img.removeEventListener('load', done);
            img.removeEventListener('error', done);
            if (current !== next) { swap(); }
          };
          img.addEventListener('load', done);
          img.addEventListener('error', done);
        }

        function stop() { clearInterval(timer); timer = null; }
        function start() {
          if (timer || reduced.matches) { return; }
          timer = setInterval(function () { show(current + 1); }, 6000);
        }
        function restart() { stop(); start(); }

        if (dots) {
          for (var i = 0; i < slides.length; i++) {
            (function (index) {
              var button = document.createElement('button');
              button.type = 'button';
              button.className = 'hero__dot';
              button.setAttribute('aria-label', 'Tampilkan foto ' + (index + 1) + ' dari ' + slides.length);
              button.addEventListener('click', function () { show(index); restart(); });
              dots.appendChild(button);
              buttons.push(button);
            })(i);
          }
          dots.hidden = false;
          paintDots();
        }

        carousel.addEventListener('mouseenter', stop);
        carousel.addEventListener('mouseleave', start);
        carousel.addEventListener('focusin', stop);
        carousel.addEventListener('focusout', start);
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) { stop(); } else { start(); }
        });
        paintBackdrop();
        start();

        // Warm the next slide after the page is idle, so the first crossfade
        // has its image ready without competing with the LCP image.
        var warm = function () { materialize((current + 1) % slides.length); };
        if (window.requestIdleCallback) {
          window.requestIdleCallback(warm, { timeout: 3000 });
        } else {
          setTimeout(warm, 1500);
        }
      }

      var filters = document.getElementById('catalogFilter');
      if (filters) {
        var cards = Array.prototype.slice.call(document.querySelectorAll('[data-category]'));
        var empty = document.getElementById('catalogEmpty');
        filters.addEventListener('click', function (event) {
          var button = event.target.closest('[data-filter]');
          if (!button) { return; }
          var value = button.getAttribute('data-filter');
          filters.querySelectorAll('[data-filter]').forEach(function (item) {
            item.setAttribute('aria-pressed', item === button ? 'true' : 'false');
          });
          var any = false;
          cards.forEach(function (card) {
            var show = value === 'all' || card.getAttribute('data-category') === value;
            card.hidden = !show;
            if (show) { any = true; }
          });
          if (empty) { empty.hidden = any; }
        });

        var initial = new URLSearchParams(window.location.search).get('kategori');
        if (initial) {
          var match = filters.querySelector('[data-filter="' + initial + '"]');
          if (match) { match.click(); }
        }
      }

      var resellerFilter = document.getElementById('resellerFilter');
      if (resellerFilter) {
        var resellerGroups = Array.prototype.slice.call(document.querySelectorAll('.reseller-group'));
        var resellerEmpty = document.getElementById('resellerEmpty');
        resellerFilter.addEventListener('input', function () {
          var query = resellerFilter.value.trim().toLowerCase();
          var any = false;
          resellerGroups.forEach(function (group) {
            var visible = 0;
            group.querySelectorAll('.reseller-item').forEach(function (item) {
              var show = item.textContent.toLowerCase().indexOf(query) !== -1;
              item.hidden = !show;
              if (show) { visible++; }
            });
            group.hidden = visible === 0;
            if (visible) { any = true; }
          });
          if (resellerEmpty) { resellerEmpty.hidden = any; }
        });
      }

      var qrModal = document.getElementById('qrModal');
      if (qrModal) {
        var qrImage = document.getElementById('qrImage');
        var qrTitle = document.getElementById('qrTitle');
        var qrOpen = document.getElementById('qrOpen');
        var qrCopy = document.getElementById('qrCopy');
        var qrClose = qrModal.querySelector('.qr-modal__close');
        var lastFocus = null;
        var currentUrl = '';

        if (!navigator.clipboard) { qrCopy.hidden = true; }

        var openQr = function (link) {
          currentUrl = link.href;
          qrTitle.textContent = link.textContent.trim();
          qrImage.src = link.getAttribute('data-qr');
          qrImage.alt = 'Kode QR WhatsApp untuk ' + qrTitle.textContent;
          qrOpen.href = currentUrl;
          lastFocus = link;
          qrModal.hidden = false;
          document.body.classList.add('is-locked');
          qrClose.focus();
        };

        var closeQr = function () {
          qrModal.hidden = true;
          document.body.classList.remove('is-locked');
          if (lastFocus) { lastFocus.focus(); }
        };

        document.querySelectorAll('.reseller-item a').forEach(function (link) {
          link.addEventListener('click', function (event) {
            if (!window.matchMedia('(min-width: 56rem)').matches) { return; }
            if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) { return; }
            event.preventDefault();
            openQr(link);
          });
        });

        qrModal.querySelectorAll('[data-close]').forEach(function (el) {
          el.addEventListener('click', closeQr);
        });

        document.addEventListener('keydown', function (event) {
          if (qrModal.hidden) { return; }
          if (event.key === 'Escape') {
            closeQr();
            return;
          }
          if (event.key === 'Tab') {
            var focusables = Array.prototype.slice.call(
              qrModal.querySelectorAll('a[href], button:not([disabled])')
            ).filter(function (el) { return !el.hidden && el.offsetParent !== null; });
            var first = focusables[0];
            var last = focusables[focusables.length - 1];
            if (event.shiftKey && document.activeElement === first) {
              event.preventDefault();
              last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
              event.preventDefault();
              first.focus();
            }
          }
        });

        qrCopy.addEventListener('click', function () {
          navigator.clipboard.writeText(currentUrl).then(function () {
            qrCopy.textContent = 'Tersalin';
            setTimeout(function () { qrCopy.textContent = 'Salin tautan'; }, 1800);
          }).catch(function () {
            qrCopy.textContent = 'Gagal menyalin';
          });
        });
      }
    })();
  </script>
</body>
</html>
